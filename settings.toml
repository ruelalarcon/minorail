[protocol.rules]
randomizer = "seven_bag"  # "seven_bag" or "pure_random"
kickset = "srs"           # kick table: "srs", "srs_plus"
rot180 = true             # allow 180-degree rotations (only effective if kickset supports it)
sonic_drop = "only"       # "only" = sonic drop only, "allow" = sonic drop and soft drop
allspin_b2b = false       # spins, including minis, of any piece contribute to back-to-back
allclear_b2b = false      # all-clears contribute to back-to-back
spawn_x = 4               # active piece spawn x coordinate
spawn_y = 19              # active piece spawn y coordinate

[protocol.start]
piece_stream_limit = 11  # 0 omits piece_stream; otherwise send up to this many generated pieces

[service.path]
convert_sonic_drops = false  # replace sonic_drop path steps with repeated soft_drop steps

[bot]
suggest_timeout_ms = 10_000  # timeout waiting for a suggestion
idle_ms = 60_000             # go idle after this long without communication to save resources

[logging.bot_info]
print = ["warning", "log"]  # runtime info topics to print, e.g. ["warning", "status", "search"]

[engine.queue]
initial = 5           # pieces to seed before sending start
refill_threshold = 5  # when queue length drops below this, add pieces until it reaches this value

[engine.randomizer]
# seed = 0  # integer base seed for reproducible local piece streams

[visualizer]
move_delay_ms = 50         # delay between each animated input step
lock_delay_ms = 150        # pause after a piece locks before the next piece appears
first_move_delay_ms = 200  # pause before animating the first move
visible_rows = 20          # how many rows of the board to show (max 40)
queue_size = 5             # number of next pieces shown in the queue panel
