[protocol.rules]
randomizer = "seven_bag"   # "seven_bag" or "pure_random"
kickset = "srs"            # "srs", "srs_plus"
rot180 = true              # allow 180-degree rotations (only effective if kickset supports it)
sonic_drop = "only"        # "only" = sonic drop only, "allow" = sonic drop and soft drop
spin_detection = "t-spins" # "none", "t-spins", "t-spins+", "all", "all+", "all-mini", "all-mini+", "mini-only"
back_to_back_sources = [
    "quad",             # four-line clears
    "t-spin",           # full T-spin clears
    "t-spin-mini",      # mini T-spin clears
    # "allspin",        # full non-T spin clears
    # "allspin-mini",   # mini non-T spin clears
    # "perfect-clear",  # board fully empty
]
spawn_x = 4   # active piece spawn x coordinate
spawn_y = 20  # active piece spawn y coordinate

[protocol.start]
piece_stream_limit = 11  # 0 omits piece_stream; otherwise send up to this many generated pieces

[service.path]
# pathfinding = false        # omit to use the consumer/visualizer's default; otherwise true or false
convert_sonic_drops = false  # replace sonic_drop path steps with repeated soft_drop steps

[bot]
suggest_timeout_ms = 10_000  # timeout waiting for a suggestion
idle_ms = 60_000             # go idle after this long without communication to save resources

[api.websocket]
host = "127.0.0.1"  # host for python minorail.py solo ws
port = 8444         # port for python minorail.py solo ws

[logging.bot_info]
print = ["warning", "log"]  # runtime info topics to print, e.g. ["warning", "status", "search"]

[game.queue]
initial = 5           # pieces to seed before sending start
refill_threshold = 5  # when queue length drops below this, add pieces until it reaches this value

[game.randomizer]
# seed = 0  # integer base seed for reproducible local piece streams

[game.attack]
calculator = "modern_guideline" # "modern_guideline", "classic_guideline", "tetrio_s2", "tetrio_s1", "ppt"

[game.limits]
# piece_limit = 1000      # stop after this many accepted piece locks
# time_limit_ms = 30_000  # stop after this many milliseconds

[visualizer]
move_delay_ms = 50         # delay between each animated input step
lock_delay_ms = 150        # pause after a piece locks before the next piece appears
first_move_delay_ms = 200  # pause before animating the first move
visible_rows = 22          # how many rows of the board to show (max 40)
queue_size = 5             # number of next pieces shown in the queue panel

[visualizer.web]
host = "127.0.0.1"  # host for python minorail.py solo play --web
# port = 8080       # omit for an automatically selected open port

[battle.garbage]
rules = "modern" # "modern", "ppt", "tetrio"
